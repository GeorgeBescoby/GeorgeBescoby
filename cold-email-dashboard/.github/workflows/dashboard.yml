# Daily cold email dashboard: Smartlead sync -> static site -> Cloudflare Pages.
#
# Runs every day at 22:55 UTC (23:55 UK summer time), on demand from the
# Actions tab ("Run workflow"), and when the dashboard settings or page change.
# History is kept on the `dashboard-data` branch of this (private) repo.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   SMARTLEAD_API_KEY      needed once dashboard.settings.json has "dataMode": "live"
#   CLOUDFLARE_API_TOKEN   token with Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard
# Variables:
#   CF_PAGES_PROJECT       Pages project name (default: bosco-cold-email)
#   ACCESS_PROTECTED       set to "true" once Cloudflare Access protects the site;
#                          live data is never published before that
name: Dashboard

on:
  schedule:
    - cron: "55 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - dashboard.settings.json
      - artifact/**
      - lib/**
      - config/**
      - scripts/**
      - .github/workflows/dashboard.yml

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT: ${{ vars.CF_PAGES_PROJECT || 'bosco-cold-email' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check live data is only published behind a login
        run: |
          mode=$(node -p "require('./dashboard.settings.json').dataMode")
          echo "DATA_MODE=$mode" >> "$GITHUB_ENV"
          if [ "$mode" = "live" ] && [ "${{ vars.ACCESS_PROTECTED }}" != "true" ]; then
            echo "::error::dashboard.settings.json is set to live, but the repo variable ACCESS_PROTECTED isn't \"true\". Set up Cloudflare Access first (see docs/SITE.md) so the numbers aren't public."
            exit 1
          fi

      - name: Load saved history
        run: |
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code "$url" refs/heads/dashboard-data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch dashboard-data "$url" state
          else
            mkdir state && git -C state init --quiet -b dashboard-data && git -C state remote add origin "$url"
          fi

      - name: Sync Smartlead
        if: env.DATA_MODE == 'live' && github.event_name != 'push'
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
        run: npm run site:sync -- state

      - name: Save history
        if: env.DATA_MODE == 'live' && github.event_name != 'push'
        run: |
          cd state
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit --quiet -m "Dashboard data $(date -u +%F)"
          git push --quiet origin dashboard-data

      - name: Build site
        run: npm run site:build -- state site

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets aren't set yet, so the site was built but not published."
            exit 0
          fi
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy site --project-name="$PROJECT" --branch=main --commit-dirty=true

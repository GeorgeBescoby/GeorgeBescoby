<title>Cold Email Economics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* ASK BOSCO brand: navy #1d0254, purple #7500e3, yellow #ffd500, ink #2c2c2c on #f6f6f6, Poppins */
:root {
  --page: #f6f6f6;
  --surface: #ffffff;
  --surface-2: #f1ecfa;
  --ink: #2c2c2c;
  --ink-2: #4f4b58;
  --muted: #6d6879;
  --grid: #ebe6f3;
  --axis: #cbc3da;
  --line: rgba(29, 2, 84, 0.1);
  --navy: #1d0254;
  --navy-ink: #ffffff;
  --navy-muted: #c9bdf0;
  --purple: #7500e3;
  --purple-wash: rgba(117, 0, 227, 0.1);
  --yellow: #ffd500;
  --on-yellow: #1d0254;
  --series: #7500e3;
  --key-bg: #1d0254;
  --critical: #d03b3b;
  --critical-ink: #b42f2f;
  --critical-wash: rgba(208, 59, 59, 0.08);
  --good-ink: #0f6b2a;
  --radius: 18px;
  --font: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #10012f; --surface: #1d0254; --surface-2: #2a0b6e; --ink: #ffffff; --ink-2: #ddd4f3; --muted: #aa9fcb;
    --grid: #2d1170; --axis: #47298f; --line: rgba(255, 255, 255, 0.12); --navy: #0b0122; --navy-muted: #aa9fcb;
    --purple: #a26bff; --purple-wash: rgba(162, 107, 255, 0.16); --series: #a26bff; --key-bg: #33117d;
    --critical-ink: #ff8080; --critical-wash: rgba(208, 59, 59, 0.22); --good-ink: #5fe08a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #10012f; --surface: #1d0254; --surface-2: #2a0b6e; --ink: #ffffff; --ink-2: #ddd4f3; --muted: #aa9fcb;
  --grid: #2d1170; --axis: #47298f; --line: rgba(255, 255, 255, 0.12); --navy: #0b0122; --navy-muted: #aa9fcb;
  --purple: #a26bff; --purple-wash: rgba(162, 107, 255, 0.16); --series: #a26bff; --key-bg: #33117d;
  --critical-ink: #ff8080; --critical-wash: rgba(208, 59, 59, 0.22); --good-ink: #5fe08a;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 24px; }
main.wrap { padding-block: 26px 56px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

/* Header: the site's navy bar */
.top { background: var(--navy); color: var(--navy-ink); }
.top .wrap { display: flex; align-items: center; gap: 12px 32px; flex-wrap: wrap; padding-block: 16px; }
.brand { display: flex; flex-direction: column; line-height: 1; font-weight: 800; }
.brand b { font-size: 12px; letter-spacing: 0.04em; }
.brand strong { font-size: 22px; letter-spacing: 0.01em; }
.brand-sub { color: var(--navy-muted); font-weight: 500; font-size: 13px; }
.tabs { display: flex; gap: 6px; }
.tabs a { text-decoration: none; color: var(--navy-ink); font-weight: 600; padding: 7px 16px; border-radius: 999px; border: 2px solid transparent; }
.tabs a:hover { border-color: rgba(255, 255, 255, 0.35); }
.tabs a[aria-current="page"] { border-color: #ffffff; }
.badge { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 999px; }
.badge.sample { background: var(--yellow); color: var(--on-yellow); }
.badge.live { background: rgba(255, 255, 255, 0.12); color: #fff; }
.badge.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #3ddc6f; }

.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin: 0; line-height: 1.15; text-wrap: balance; }
h1 .accent { color: var(--purple); }
h2 { font-size: 17px; font-weight: 700; margin: 30px 0 12px; }
.range { margin: 4px 0 0; color: var(--muted); }
.seg { display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 7px 16px; border-radius: 999px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.seg button:hover { color: var(--purple); }
.seg button[aria-pressed="true"] { background: var(--purple); color: #fff; }

.note { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin: 0 0 16px; color: var(--ink-2); }
.note strong { color: var(--ink); }
.note.warn { border-left: 4px solid var(--yellow); }
.fine { color: var(--muted); font-size: 13px; margin: 8px 0 0; }

/* KPIs: purple figures like the site's stats; headline tiles in brand navy + yellow */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
.k-label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.k-value { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; margin-top: 2px; white-space: nowrap; color: var(--purple); }
.k-sub { font-size: 12.5px; color: var(--muted); }
.kpi.key { background: var(--key-bg); border-color: var(--key-bg); }
.kpi.key .k-label { color: #ffffff; }
.kpi.key .k-value { color: var(--yellow); }
.kpi.key .k-sub { color: #c9bdf0; }
.kpi.alert { border: 2px solid var(--critical); background: var(--critical-wash); }
.kpi.alert .k-value, .kpi.alert .k-sub { color: var(--critical-ink); }

.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.chart { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 16px 8px; min-width: 0; }
.chart figcaption { display: flex; flex-direction: column; margin: 0 4px 6px; }
.chart figcaption strong { font-weight: 700; }
.chart figcaption span { color: var(--muted); font-size: 12.5px; }
.plot { position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.grid { stroke: var(--grid); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1; }
.tick { fill: var(--muted); font-size: 11.5px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.bar { fill: var(--series); }
.line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dot { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
.cross { stroke: var(--axis); stroke-width: 1; }
.hit { fill: transparent; cursor: crosshair; }
.hit.on, .hit:focus-visible { fill: var(--purple-wash); outline: none; }
.tip { position: absolute; top: 0; transform: translateX(-50%); background: #1d0254; color: #fff; border-radius: 10px; padding: 6px 12px; font-size: 12.5px; box-shadow: 0 6px 18px rgba(29, 2, 84, 0.25); pointer-events: none; display: flex; flex-direction: column; white-space: nowrap; }
.tip span { color: #c9bdf0; }
.tip strong { color: var(--yellow); }
.tip[hidden] { display: none; }

.tableview { margin-top: 16px; }
.tableview summary { cursor: pointer; color: var(--purple); font-weight: 700; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-top: 8px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { background: var(--surface-2); font-size: 12px; font-weight: 700; color: var(--ink-2); vertical-align: bottom; white-space: normal; line-height: 1.25; }
th button { all: unset; cursor: pointer; }
th button:hover { color: var(--purple); }
th[aria-sort="ascending"] button, th[aria-sort="descending"] button { color: var(--purple); }
th button:focus-visible { outline: 2px solid var(--purple); }
tbody tr:hover { background: var(--surface-2); }
tfoot td { font-weight: 800; border-bottom: 0; border-top: 2px solid var(--grid); }
table.camp td:first-child { white-space: normal; min-width: 210px; }
.cname { display: block; font-weight: 600; }
.cstatus { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: capitalize; }
td.bad { color: var(--critical-ink); background: var(--critical-wash); font-weight: 800; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
.panel h2 { margin: 0 0 4px; }
.help { margin: 0 0 12px; color: var(--muted); max-width: 72ch; }
.radio { display: flex; gap: 22px; flex-wrap: wrap; font-weight: 600; }
.radio label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.radio input { accent-color: var(--purple); width: 16px; height: 16px; }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
.fields label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.fields .wide { grid-column: span 2; }
input[type="text"], input[type="number"], input[type="date"] { width: 100%; font-weight: 400; padding: 8px 12px; border: 1px solid var(--axis); border-radius: 10px; background: var(--page); min-width: 0; }
input:focus-visible { outline: 2px solid var(--purple); outline-offset: 0; border-color: var(--purple); }
input:disabled { opacity: 0.7; }
table.costs th, table.costs td { text-align: left; }
table.costs td.num, table.costs tfoot td.num { text-align: right; }
table.costs td { min-width: 110px; }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.actions button { padding: 10px 22px; border-radius: 999px; border: 2px solid var(--purple); background: transparent; color: var(--purple); font-weight: 700; cursor: pointer; }
.actions button.primary { background: var(--yellow); border-color: var(--yellow); color: var(--on-yellow); }
.actions button:hover { filter: brightness(1.05); }
.actions button:disabled { opacity: 0.5; cursor: default; }
.ok { color: var(--good-ink); font-weight: 700; }
.err { color: var(--critical-ink); font-weight: 700; }

@media (max-width: 1080px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 720px) {
  .wrap { padding-inline: 16px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .charts, .fields { grid-template-columns: 1fr; }
  .fields .wide { grid-column: auto; }
  .k-value { font-size: 23px; }
  h1 { font-size: 24px; }
  .seg button { padding: 6px 9px; font-size: 12.5px; }
  .tabs a { padding: 6px 11px; }
  .badge { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<div id="app"></div>
<script>/*BUNDLE*/</script>

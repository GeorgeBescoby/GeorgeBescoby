<title>Cold Email Economics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --page: #f6f7f5;
  --surface: #fdfdfc;
  --surface-2: #eef0ec;
  --ink: #101312;
  --ink-2: #4b524e;
  --muted: #6b726d;
  --grid: #e1e4df;
  --axis: #c1c7c1;
  --line: rgba(16, 19, 18, 0.1);
  --accent: #2a78d6;
  --accent-wash: rgba(42, 120, 214, 0.1);
  --accent-ring: rgba(42, 120, 214, 0.45);
  --critical: #d03b3b;
  --critical-ink: #b42f2f;
  --critical-wash: rgba(208, 59, 59, 0.08);
  --good-ink: #0f6b2a;
  --warn: #eda100;
  --radius: 12px;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0e100f; --surface: #181b19; --surface-2: #222623; --ink: #f4f6f4; --ink-2: #c3c9c4; --muted: #939a95;
    --grid: #2a2e2b; --axis: #3a403c; --line: rgba(255, 255, 255, 0.1); --accent: #3987e5; --accent-wash: rgba(57, 135, 229, 0.14);
    --accent-ring: rgba(57, 135, 229, 0.55); --critical-ink: #ef7070; --critical-wash: rgba(208, 59, 59, 0.18); --good-ink: #3ecf6a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0e100f; --surface: #181b19; --surface-2: #222623; --ink: #f4f6f4; --ink-2: #c3c9c4; --muted: #939a95;
  --grid: #2a2e2b; --axis: #3a403c; --line: rgba(255, 255, 255, 0.1); --accent: #3987e5; --accent-wash: rgba(57, 135, 229, 0.14);
  --accent-ring: rgba(57, 135, 229, 0.55); --critical-ink: #ef7070; --critical-wash: rgba(208, 59, 59, 0.18); --good-ink: #3ecf6a;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: 14.5px; line-height: 1.45; }
#app { max-width: 1280px; margin: 0 auto; padding-inline: 24px; padding-block: 0 48px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap; padding-block: 16px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.brand { font-weight: 800; letter-spacing: 0.02em; font-size: 14px; }
.brand span { font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.tabs { display: flex; gap: 2px; }
.tabs a { text-decoration: none; color: var(--ink-2); font-weight: 600; padding: 6px 12px; border-radius: 8px; }
.tabs a:hover { background: var(--surface-2); }
.tabs a[aria-current="page"] { background: var(--surface-2); color: var(--ink); }
.badge { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; }
.badge.sample::before { background: var(--warn); }
.badge.live::before { background: #0ca30c; }

.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 700; margin: 26px 0 12px; }
.range { margin: 2px 0 0; color: var(--muted); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1); }

.note { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin: 0 0 16px; color: var(--ink-2); }
.note strong { color: var(--ink); }
.note.warn { border-left: 3px solid var(--warn); }
.fine { color: var(--muted); font-size: 13px; margin: 8px 0 0; }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.kpi.key { border-color: var(--accent-ring); }
.kpi.alert { border-color: var(--critical); background: var(--critical-wash); }
.k-label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.k-value { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; margin-top: 3px; white-space: nowrap; }
.kpi.alert .k-value, .kpi.alert .k-sub { color: var(--critical-ink); }
.k-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }

.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.chart { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 14px 6px; min-width: 0; }
.chart figcaption { display: flex; flex-direction: column; margin: 0 4px 6px; }
.chart figcaption span { color: var(--muted); font-size: 12.5px; }
.plot { position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.grid { stroke: var(--grid); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1; }
.tick { fill: var(--muted); font-size: 11.5px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.bar { fill: var(--accent); }
.line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.cross { stroke: var(--axis); stroke-width: 1; }
.hit { fill: transparent; cursor: crosshair; }
.hit.on { fill: var(--accent-wash); }
.hit:focus-visible { outline: none; fill: var(--accent-wash); }
.tip { position: absolute; top: 0; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14); pointer-events: none; display: flex; flex-direction: column; white-space: nowrap; }
.tip span { color: var(--muted); }
.tip[hidden] { display: none; }

.tableview { margin-top: 14px; }
.tableview summary { cursor: pointer; color: var(--ink-2); font-weight: 600; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-top: 8px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 11px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { background: var(--surface-2); font-size: 12px; font-weight: 700; color: var(--ink-2); vertical-align: bottom; white-space: normal; line-height: 1.25; }
th button { all: unset; cursor: pointer; }
th button:hover { color: var(--ink); }
th button:focus-visible { outline: 2px solid var(--accent); }
tbody tr:hover { background: var(--surface-2); }
tfoot td { font-weight: 800; border-bottom: 0; border-top: 2px solid var(--grid); }
table.camp td:first-child { white-space: normal; min-width: 200px; }
.cname { display: block; font-weight: 700; }
.cstatus { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); }
td.bad { color: var(--critical-ink); background: var(--critical-wash); font-weight: 800; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; }
.panel h2 { margin: 0 0 4px; }
.help { margin: 0 0 12px; color: var(--muted); max-width: 72ch; }
.radio { display: flex; gap: 20px; flex-wrap: wrap; font-weight: 600; }
.radio label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
.fields label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.fields .wide { grid-column: span 2; }
input[type="text"], input[type="number"], input[type="date"] { width: 100%; font-weight: 500; padding: 7px 10px; border: 1px solid var(--axis); border-radius: 8px; background: var(--page); min-width: 0; }
input:disabled { opacity: 0.7; }
table.costs th, table.costs td { text-align: left; }
table.costs td.num, table.costs tfoot td.num { text-align: right; }
table.costs td { min-width: 110px; }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.actions button { padding: 8px 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; }
.actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.actions button:disabled { opacity: 0.55; cursor: default; }
.ok { color: var(--good-ink); font-weight: 700; }
.err { color: var(--critical-ink); font-weight: 700; }

@media (max-width: 1080px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 720px) {
  #app { padding-inline: 16px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .charts, .fields { grid-template-columns: 1fr; }
  .fields .wide { grid-column: auto; }
  .k-value { font-size: 22px; }
  .seg button { padding: 6px 8px; font-size: 13px; }
  .badge { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<div id="app"></div>
<script>/*BUNDLE*/</script>
